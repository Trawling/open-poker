name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Тесты движка
        run: npm run test -w packages/engine

      - name: Сборка engine
        run: npm run build -w packages/engine

      - name: Сборка backend
        run: npm run build -w backend

      - name: Сборка frontend
        run: npm run build -w frontend

      - name: Проверка типов frontend
        run: npx tsc -p frontend/tsconfig.json --noEmit

      - name: Сквозной smoke-тест (backend + 2 сокет-клиента)
        env:
          # У каждого шага, поднимающего backend.dist/server.js, — своя
          # директория данных, иначе при restore столов из "data/" по
          # умолчанию шаги в одном job делят состояние друг друга.
          DATA_DIR: /tmp/open-poker-ci-data-smoke
        run: |
          node backend/dist/server.js &
          BACKEND_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:4000/health && break
            sleep 0.5
          done
          node scripts/smoke-test.mjs
          node scripts/rebuy-test.mjs
          node scripts/stakes-test.mjs
          node scripts/stats-test.mjs
          kill $BACKEND_PID

      - name: Тест персистентности (реальный рестарт backend)
        run: node scripts/persistence-test.mjs

      - name: Тест турнирного режима (может занимать до нескольких минут)
        timeout-minutes: 12
        env:
          DATA_DIR: /tmp/open-poker-ci-data-tournament
        run: |
          node backend/dist/server.js &
          BACKEND_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:4000/health && break
            sleep 0.5
          done
          node scripts/tournament-test.mjs
          kill $BACKEND_PID
