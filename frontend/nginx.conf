server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket и polling-транспорт Socket.IO проксируются на тот же домен,
    # чтобы не было проблем с CORS и фронтенд с бэкендом выглядели одним сервисом.
    location /socket.io/ {
        proxy_pass http://backend:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://backend:4000/health;
    }

    # SPA: все остальные пути отдают index.html, роутинг на стороне React.
    location / {
        try_files $uri /index.html;
    }
}
